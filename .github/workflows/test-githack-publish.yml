name: TEST Publish to GitHub (GitHack)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Сбор основных источников (URL, локальные файлы, Base64)
        run: |
          mkdir -p ./downloads
          > mobile-whitelist-1.txt

          if [ -f sources.txt ]; then
            while IFS= read -r url || [ -n "$url" ]; do
              if [[ -z "$url" || "$url" =~ ^[[:space:]]*# ]]; then
                continue
              fi
              url=$(echo "$url" | xargs)
              if [[ -n "$url" ]]; then
                filename="raw_$(date +%s%N)_$RANDOM.tmp"
                if curl -L -f --fail-early -o "./downloads/$filename" "$url"; then
                  grep -v '^[[:space:]]*#' "./downloads/$filename" | sed '/^$/d' >> mobile-whitelist-1.txt
                  echo "Добавлено из URL: $url"
                else
                  echo "Ошибка скачивания: $url" >&2
                fi
              fi
            done < sources.txt
          fi

          if [ -f VPN-Vless.txt ]; then
            grep -v '^[[:space:]]*#' VPN-Vless.txt | sed '/^$/d' >> mobile-whitelist-1.txt
          fi

          if [ -f Base64.txt ]; then
            while IFS= read -r base64_url || [ -n "$base64_url" ]; do
              [[ -z "$base64_url" || "$base64_url" =~ ^[[:space:]]*# ]] && continue
              base64_url=$(echo "$base64_url" | xargs)
              if [[ -n "$base64_url" ]]; then
                b64_filename="b64_$(date +%s%N)_$RANDOM.tmp"
                if curl -L -f --fail-early -o "./downloads/$b64_filename" "$base64_url"; then
                  base64 --decode "./downloads/$b64_filename" 2>/dev/null | grep -v '^[[:space:]]*#' | sed '/^$/d' >> mobile-whitelist-1.txt
                fi
                rm -f "./downloads/$b64_filename"
              fi
            done < Base64.txt
          fi

          sed -i '/^$/d' mobile-whitelist-1.txt

      - name: Проверить содержимое файла
        run: |
          total=$(grep -c . mobile-whitelist-1.txt || true)
          vless=$(grep -c 'vless://' mobile-whitelist-1.txt || true)
          echo "строк: $total, vless: $vless"
          if [ "$vless" -lt 1 ]; then
            echo "ОШИБКА: в файле нет vless-ссылок"
            exit 1
          fi

      - name: Сохранить файл в GitHub (проверка GitHack-ссылки)
        run: |
          echo "# Last updated: $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M:%S МСК')" >> mobile-whitelist-1.txt

          git config user.name "GitHub Action Bot"
          git config user.email "action@noreply.github.com"

          git add mobile-whitelist-1.txt

          if git commit -m "auto update checked whitelist $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M:%S МСК')"; then
            for i in $(seq 1 8); do
              git pull --rebase -X theirs origin main 2>/dev/null || true
              if git push origin main; then
                echo "✅ Файл сохранён в GitHub"
                exit 0
              fi
              echo "Push в GitHub не удался, повтор через $((i*10)) сек..."
              sleep $((i*10))
            done
            echo "ОШИБКА: не удалось отправить файл в GitHub после 8 попыток"
            exit 1
          else
            echo "GitHub: нет изменений (файл уже актуален)"
          fi